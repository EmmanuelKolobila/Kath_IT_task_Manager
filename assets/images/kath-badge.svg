<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="kathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6efd" />
      <stop offset="50%" stop-color="#084298" />
      <stop offset="100%" stop-color="#052c65" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc107" />
      <stop offset="100%" stop-color="#d39e00" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Outer Shield Background -->
  <path d="M100 10 L180 45 C180 120 100 185 100 185 C100 185 20 120 20 45 Z" fill="url(#kathGrad)" filter="url(#shadow)" stroke="#ffc107" stroke-width="4"/>
  <!-- Gold Accent Inner Border -->
  <path d="M100 20 L170 50 C170 115 100 172 100 172 C100 172 30 115 30 50 Z" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  <!-- Medical Red / Gold Cross -->
  <rect x="88" y="55" width="24" height="65" rx="4" fill="url(#goldGrad)" />
  <rect x="67.5" y="75.5" width="65" height="24" rx="4" fill="url(#goldGrad)" />
  <!-- IT Connectivity Nodes / Data Circuit Overlay -->
  <circle cx="100" cy="87.5" r="7" fill="#ffffff" />
  <circle cx="100" cy="45" r="4.5" fill="#ffffff" />
  <line x1="100" y1="45" x2="100" y2="55" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <circle cx="55" cy="87.5" r="4.5" fill="#ffffff" />
  <line x1="55" y1="87.5" x2="67.5" y2="87.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <circle cx="145" cy="87.5" r="4.5" fill="#ffffff" />
  <line x1="132.5" y1="87.5" x2="145" y2="87.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <circle cx="100" cy="130" r="4.5" fill="#ffffff" />
  <line x1="100" y1="120" x2="100" y2="130" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <!-- KATH Text Banner -->
  <rect x="50" y="142" width="100" height="22" rx="4" fill="#052c65" stroke="#ffc107" stroke-width="1.5" />
  <text x="100" y="158" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">KATH IT</text>
</svg>
